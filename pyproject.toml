[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scraping-wiki"
version = "0.1.0"
description = "Selenium scraper for the Wikipedia main page (Udemy 100 Days of Code)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["selenium>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scraping-wiki = "scraping_wiki.interaction:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
